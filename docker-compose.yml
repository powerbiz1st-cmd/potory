# POTORY — 커스텀 화분 플랫폼 (개발용 구성)
# 실행: docker compose up -d   →  Shop :5173 · Admin :5174 · Console :5175 · API :3000/health · 메일함 :8025
# 비밀값은 .env 파일에 (.env.example 참고). .env 는 git에 올라가지 않습니다.
services:
  db:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: potory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-potory_dev}
      POSTGRES_DB: potory
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potory -d potory"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 개발 중 DB 툴로 보고 싶으면 주석 해제
    # ports: ["5432:5432"]

  api:
    restart: unless-stopped
    image: node:22-alpine
    working_dir: /app
    # 설치 → Prisma 클라이언트 생성 → DB 마이그레이션 적용 → 개발 서버(파일 바뀌면 자동 재시작)
    command: sh -c "npm install --no-audit --no-fund && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://potory:${POSTGRES_PASSWORD:-potory_dev}@db:5432/potory
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-false} # 장애 시연 버튼 (시연용 PC에서만 true)
      TSC_WATCHFILE: DynamicPriorityPolling # Docker + Windows 볼륨에서 파일 변경 감지
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  shop:
    restart: unless-stopped
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/shop:/app
      - shop_node_modules:/app/node_modules # node_modules는 컨테이너 안에만 둠 (Windows 파일 공유 속도 문제 회피)
    environment:
      - CHOKIDAR_USEPOLLING=true
      # 비워두면 "지금 접속한 주소:3000" 을 API로 사용 (같은 와이파이 휴대폰에서도 동작)
      - VITE_API_URL=${VITE_API_URL:-}

  admin:
    restart: unless-stopped
    image: node:22-alpine
    # Shop의 디자인 타입·화분 그림(apps/shop/src)을 같이 쓰려고 apps 폴더 전체를 붙임
    working_dir: /apps/admin
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./apps:/apps
      - admin_node_modules:/apps/admin/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-}

  console:
    restart: unless-stopped
    image: node:22-alpine
    working_dir: /apps/console
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    volumes:
      - ./apps:/apps
      - console_node_modules:/apps/console/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-}

  # ---- 8. 배포: API를 외부에 여는 Cloudflare 임시 터널 ----
  # 평소엔 안 켜짐. tools/demo/start-demo.ps1 이 켜고, 주소(https://xxxx.trycloudflare.com)를 Pages 빌드에 넘김
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:3000
    depends_on:
      - api

  # ---- 7. 모니터링 · 알림 · 백업 ----
  watchdog:
    # 각 서비스를 10초마다 확인, 장애/복구 시 메일 (설정은 .env 의 SMTP_* / ALERT_TO)
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && node watchdog.mjs"
    ports:
      - "3100:3100"
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_FROM: ${ALERT_FROM:-}
      ALERT_TO: ${ALERT_TO:-}
      CHECK_INTERVAL_SEC: ${CHECK_INTERVAL_SEC:-5}
    volumes:
      - ./apps/watchdog:/app
      - watchdog_node_modules:/app/node_modules
      - watchdog_data:/data
      - ./backups:/backups:ro

  mailpit:
    # 가짜 메일함: SMTP 설정 전에도 알림 메일을 http://localhost:8025 에서 확인
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - "8025:8025"

  backup:
    # DB를 켜질 때 1번 + 24시간마다 ./backups 에 저장, 최근 7개 보관
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-potory_dev}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./tools/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  admin_node_modules:
  console_node_modules:
  api_node_modules:
  shop_node_modules:
  watchdog_node_modules:
  watchdog_data:
