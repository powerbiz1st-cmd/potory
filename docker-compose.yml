# POTORY — 커스텀 화분 플랫폼 (개발용 구성)
# 실행: docker compose up -d   →  Shop http://localhost:5173 · API http://localhost:3000/health
# 비밀값은 .env 파일에 (.env.example 참고). .env 는 git에 올라가지 않습니다.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: potory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-potory_dev}
      POSTGRES_DB: potory
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potory -d potory"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 개발 중 DB 툴로 보고 싶으면 주석 해제
    # ports: ["5432:5432"]

  api:
    image: node:22-alpine
    working_dir: /app
    # 설치 → Prisma 클라이언트 생성 → DB 마이그레이션 적용 → 개발 서버(파일 바뀌면 자동 재시작)
    command: sh -c "npm install --no-audit --no-fund && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://potory:${POSTGRES_PASSWORD:-potory_dev}@db:5432/potory
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TSC_WATCHFILE: DynamicPriorityPolling # Docker + Windows 볼륨에서 파일 변경 감지
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  shop:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/shop:/app
      - shop_node_modules:/app/node_modules # node_modules는 컨테이너 안에만 둠 (Windows 파일 공유 속도 문제 회피)
    environment:
      - CHOKIDAR_USEPOLLING=true
      # 비워두면 "지금 접속한 주소:3000" 을 API로 사용 (같은 와이파이 휴대폰에서도 동작)
      - VITE_API_URL=${VITE_API_URL:-}

  admin:
    image: node:22-alpine
    # Shop의 디자인 타입·화분 그림(apps/shop/src)을 같이 쓰려고 apps 폴더 전체를 붙임
    working_dir: /apps/admin
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./apps:/apps
      - admin_node_modules:/apps/admin/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-}

  console:
    image: node:22-alpine
    working_dir: /apps/console
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    volumes:
      - ./apps:/apps
      - console_node_modules:/apps/console/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-}

volumes:
  db_data:
  admin_node_modules:
  console_node_modules:
  api_node_modules:
  shop_node_modules:
